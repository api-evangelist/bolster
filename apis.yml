description: Bolster is an executive search and recruiting platform that pairs experienced recruiters
  with an AI-powered talent platform to place full-time executives, board members, and fractional or
  interim leaders for high-growth companies, startups, and venture capital firms. Bolster emphasizes
  speed (typically five days to a first interview), transparent flat-fee pricing, and a data-driven
  approach informed by analysis of more than 280,000 executives across 30,000+ companies, with 350+
  placements and a 40% repeat-client rate. It is backed by Union Square Ventures.
